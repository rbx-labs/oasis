version: "3.8"

services:
  fastapi:
    build: .
    container_name: oasis_app
    volumes:
      - .:/app
      - ./data:/data
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY}
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    env_file:
      - .env

  ngrok:
    image: wernight/ngrok
    container_name: oasis_ngrok
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: ngrok http fastapi:8000
    env_file:
      - .env
    entrypoint: /bin/sh -c "if [ -z \"$NGROK_AUTHTOKEN\" ]; then echo 'NGROK_AUTHTOKEN is not set, skipping ngrok'; else ngrok http fastapi:8000; fi"
